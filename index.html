
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장소 검색 서비스</title>

  <style>
    /* 전체 화면 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* 화면을 왼쪽과 오른쪽으로 분할 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      width: 360px;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-right: 1px solid #dddddd;
    }

    .header {
      padding: 24px 20px 16px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 24px;
      color: #222222;
    }

    .header p {
      margin: 0;
      color: #777777;
      font-size: 13px;
    }

    /* 검색창 */
    .search-form {
      display: flex;
      gap: 8px;
      padding: 0 16px 16px;
    }

    #keyword {
      flex: 1;
      width: 0;
      padding: 12px;
      border: 1px solid #dddddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    #keyword:focus {
      border-color: #f5c400;
    }

    #searchButton {
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      background: #fee500;
      font-weight: bold;
      cursor: pointer;
    }

    #searchButton:hover {
      background: #f5d900;
    }

    /* 검색 결과 목록 */
    .result-header {
      padding: 14px 20px;
      border-top: 1px solid #eeeeee;
      border-bottom: 1px solid #eeeeee;
      font-size: 14px;
      font-weight: bold;
    }

    #status {
      padding: 12px 20px;
      color: #777777;
      font-size: 13px;
      line-height: 1.5;
    }

    #resultList {
      flex: 1;
      overflow-y: auto;
    }

    .place-item {
      padding: 16px 20px;
      border-bottom: 1px solid #eeeeee;
      cursor: pointer;
    }

    .place-item:hover {
      background: #fffbea;
    }

    .place-item h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .place-item p {
      margin: 4px 0;
      color: #666666;
      font-size: 12px;
      line-height: 1.5;
    }

    .place-item a {
      display: inline-block;
      margin-top: 8px;
      color: #3867d6;
      font-size: 12px;
      text-decoration: none;
    }

    /* 오른쪽 지도 영역 */
    #map {
      flex: 1;
      height: 100%;
      min-width: 0;
      background: #eeeeee;
    }

    /* 화면이 좁을 때의 레이아웃 */
    @media (max-width: 600px) {
      .sidebar {
        width: 45%;
        min-width: 0;
      }

      .header {
        padding: 16px 10px;
      }

      .header h1 {
        font-size: 18px;
      }

      .search-form {
        padding: 0 8px 12px;
        gap: 4px;
      }

      #keyword {
        padding: 9px 6px;
        font-size: 12px;
      }

      #searchButton {
        padding: 0 8px;
        font-size: 12px;
      }

      .place-item {
        padding: 12px 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽 검색 영역 -->
    <aside class="sidebar">
      <div class="header">
        <h1>📍 장소 찾기</h1>
        <p>원하는 장소를 검색해 보세요.</p>
      </div>

      <form class="search-form" id="searchForm">
        <input
          type="text"
          id="keyword"
          placeholder="장소 또는 키워드 입력"
          aria-label="장소 검색어"
          required
        >
        <button type="submit" id="searchButton">검색</button>
      </form>

      <div class="result-header">검색 결과</div>
      <div id="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다.
      </div>
      <div id="resultList"></div>
    </aside>

    <!-- 오른쪽 지도 영역 -->
    <main id="map" aria-label="장소 검색 지도"></main>

  </div>

  <!-- 카카오맵 SDK: 지도와 장소 검색 기능을 불러옴 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=30d58f592542917f9846f0a37390e91c&libraries=services&autoload=false">
  </script>

  <script>
    // HTML 요소 가져오기
    const searchForm = document.getElementById("searchForm");
    const keywordInput = document.getElementById("keyword");
    const resultList = document.getElementById("resultList");
    const statusText = document.getElementById("status");

    // 지도와 검색 기능에 필요한 변수
    let map;
    let places;
    let markers = [];
    let infoWindow;
    let currentLocation = null;

    // 지도 SDK가 로드된 후 지도 초기화
    window.addEventListener("load", function () {
      if (!window.kakao || !kakao.maps) {
        statusText.textContent =
          "카카오맵 SDK를 불러오지 못했습니다. 인터넷과 API 키를 확인해 주세요.";
        return;
      }

      // 지도 API가 준비된 다음 초기화 실행
      kakao.maps.load(function () {
        initializeMap();
      });
    });

    // 지도 초기화
    function initializeMap() {
      // 현재 위치를 가져오지 못했을 때 사용할 기본 좌표
      const defaultPosition = new kakao.maps.LatLng(
        37.5665,
        126.9780
      );

      // 지도 생성
      map = new kakao.maps.Map(
        document.getElementById("map"),
        {
          center: defaultPosition,
          level: 4
        }
      );

      // 장소 검색 객체 생성
      places = new kakao.maps.services.Places();

      // 장소 정보 창 생성
      infoWindow = new kakao.maps.InfoWindow({
        zIndex: 10
      });

      statusText.textContent =
        "현재 위치를 확인하고 있습니다.";

      // 지도 생성 후 현재 위치 확인
      getCurrentLocation();
    }

    // 현재 위치 가져오기
    function getCurrentLocation() {
      if (!navigator.geolocation) {
        statusText.textContent =
          "위치 기능을 지원하지 않아 서울 시청을 중심으로 표시합니다.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 현재 위치의 위도와 경도 가져오기
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          currentLocation = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          // 현재 위치를 지도 중심으로 설정
          map.setCenter(currentLocation);
          map.setLevel(4);

          // 현재 위치 마커 표시
          const currentMarker = new kakao.maps.Marker({
            map: map,
            position: currentLocation,
            title: "현재 위치"
          });

          // 현재 위치 정보 창 표시
          const currentInfo = new kakao.maps.InfoWindow({
            content:
              '<div style="padding:8px;font-size:12px;">현재 위치</div>'
          });

          currentInfo.open(map, currentMarker);

          statusText.textContent =
            "현재 위치를 표시했습니다. 장소를 검색해 보세요.";
        },
        function (error) {
          // 위치 접근에 실패하면 기본 위치에서 지도 사용
          const errorMessages = {
            1: "위치 권한이 거부되었습니다.",
            2: "현재 위치를 확인할 수 없습니다.",
            3: "위치 확인 시간이 초과되었습니다."
          };

          statusText.textContent =
            (errorMessages[error.code] || "위치를 확인하지 못했습니다.") +
            " 서울 시청을 중심으로 검색할 수 있습니다.";
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // 검색창에서 엔터 또는 검색 버튼을 누르면 실행
    searchForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const keyword = keywordInput.value.trim();

      if (!keyword) {
        statusText.textContent = "검색어를 입력해 주세요.";
        return;
      }

      searchPlaces(keyword);
    });

    // 검색어에 맞는 장소 찾기
    function searchPlaces(keyword) {
      statusText.textContent = "장소를 검색하고 있습니다.";
      resultList.replaceChildren();

      // 이전 검색 결과의 마커 제거
      removeMarkers();
      infoWindow.close();

      // 현재 지도 중심을 기준으로 키워드 검색
      places.keywordSearch(
        keyword,
        function (data, resultStatus) {
          if (
            resultStatus !== kakao.maps.services.Status.OK
          ) {
            if (
              resultStatus ===
              kakao.maps.services.Status.ZERO_RESULT
            ) {
              statusText.textContent =
                "검색 결과가 없습니다. 다른 검색어를 입력해 보세요.";
            } else {
              statusText.textContent =
                "검색 중 오류가 발생했습니다. 다시 시도해 주세요.";
            }
            return;
          }

          statusText.textContent =
            "검색 결과 " + data.length + "개";

          // 검색 결과 목록과 지도 마커 표시
          displayResults(data);
        },
        {
          location: map.getCenter(),
          radius: 20000,
          sort: kakao.maps.services.SortBy.DISTANCE
        }
      );
    }

    // 검색 결과를 왼쪽 목록과 지도에 표시
    function displayResults(data) {
      const bounds = new kakao.maps.LatLngBounds();

      data.forEach(function (place, index) {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        bounds.extend(position);

        // 지도에 장소 마커 추가
        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name
        });

        markers.push(marker);

        // 장소 이름과 주소를 표시할 정보 창 내용
        const content =
          '<div style="padding:8px;font-size:12px;">' +
          escapeHTML(place.place_name) +
          "</div>";

        // 마커를 누르면 장소 이름 표시
        kakao.maps.event.addListener(
          marker,
          "click",
          function () {
            infoWindow.setContent(content);
            infoWindow.open(map, marker);
          }
        );

        // 검색 결과 항목 생성
        const item = document.createElement("div");
        item.className = "place-item";

        const title = document.createElement("h3");
        title.textContent = (index + 1) + ". " + place.place_name;

        const category = document.createElement("p");
        category.textContent =
          place.category_name || "분류 정보 없음";

        const address = document.createElement("p");
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        item.append(title, category, address);

        // 카카오맵의 상세 장소 페이지 연결
        if (place.place_url) {
          const link = document.createElement("a");
          link.textContent = "카카오맵에서 보기";
          link.href = place.place_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          item.appendChild(link);
        }

        // 목록을 누르면 해당 장소로 이동
        item.addEventListener("click", function (event) {
          if (event.target.closest("a")) {
            return;
          }

          map.panTo(position);
          infoWindow.setContent(content);
          infoWindow.open(map, marker);
        });

        resultList.appendChild(item);
      });

      // 모든 검색 결과가 보이도록 지도 범위 조정
      if (data.length > 0) {
        map.setBounds(bounds);
      }
    }

    // 이전 검색 결과의 마커 삭제
    function removeMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });

      markers = [];
    }

    // 장소 이름을 정보 창 HTML에 넣기 전 안전하게 처리
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, function (char) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[char];
      });
    }
  </script>
</body>
</html>
